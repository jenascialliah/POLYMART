<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login - PolyMart</title>
  <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Archivo+Narrow&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;700;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="login_style.css" />
</head>
<body>
  <header>
  <nav>
    <div class="logo-container">
      <img
        src="./elements/pm_logo.png"
        alt="PolyMart logo"
        width="32"
        height="32"
        style="display:block; border-radius: 15%;"
      />
      <span class="logo-text">PolyMart</span>
    </div>
  </nav>
</header>
<video autoplay muted loop id="bg-video">
  <source src="elements/bg_moving5.mp4" type="video/mp4">
  Your browser does not support the video tag.
</video>
  <div class="login-card">
    <h2>Welcome Back!</h2>
    <p>Sign in to continue to PolyMart</p>
    <form id="loginForm">
      <input type="email" id="loginEmail" placeholder="Enter your email" required />
      <input type="password" id="loginPassword" placeholder="Enter your password" required />

      <div class="form-row">
        <label><input type="checkbox" /> Remember me</label>
        <a href="#">Forgot Password?</a>
      </div>

      <button type="submit" class="login-btn">Sign In</button>
    </form>
    <div class="signup-link">
      Don't have an account? <a href="signup.html">Sign Up</a>
    </div>
  </div>
  <script>
  window.addEventListener('DOMContentLoaded', () => {
    document.body.classList.add('loaded');
  });
</script>
 <script src="pm.js"></script>
 <script src="auth.js"></script>
<script>
  document.getElementById("loginForm").addEventListener("submit", function (e) {
  e.preventDefault();

  const email = document.getElementById("loginEmail").value.trim();
  const password = document.getElementById("loginPassword").value;

  fetch("login.php", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ email, password })
  })
  .then(res => res.json())
  .then(data => {
    if (data.success) {
      localStorage.setItem("currentUser", data.email);
      localStorage.setItem("currentUserData", JSON.stringify({
  firstName: data.firstName,
  lastName: data.lastName,
  username: data.username || "",
  email: data.email,
  phone: data.phone || "",
  profileImage: data.profileImage || ""
}));
      alert(`Welcome back, ${data.firstName}!`);
      window.location.href = "main_pm.html";
    } else {
      alert(data.message);
    }
  })
  .catch(err => {
    console.error("Login error:", err);
    alert("An error occurred during login.");
  });
});

</script>




</body>
</html>
